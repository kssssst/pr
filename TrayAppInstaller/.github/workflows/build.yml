name: Build TrayApp Installer

'on':
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      app_repository:
        description: 'GitHub repository with TrayApp source code (owner/repo)'
        required: false
        default: ''
      app_ref:
        description: 'Git ref of the TrayApp source repository to build'
        required: false
        default: ''
      product_version:
        description: 'MSI product version'
        required: false
        default: '1.0.0'

env:
  PRODUCT_VERSION: ${{ inputs.product_version || '1.0.0' }}

jobs:
  build-installer:
    runs-on: windows-11-arm

    steps:
      - name: Checkout current repository
        uses: actions/checkout@v4

      - name: Resolve TrayApp source location
        id: source
        run: |
          $requestedRepository = '${{ inputs.app_repository || vars.APP_SOURCE_REPOSITORY || '' }}'
          $requestedRef = '${{ inputs.app_ref || vars.APP_SOURCE_REF || '' }}'

          if ([string]::IsNullOrWhiteSpace($requestedRepository)) {
            $requestedRepository = '${{ github.repository }}'
          }

          if ([string]::IsNullOrWhiteSpace($requestedRef)) {
            $requestedRef = '${{ github.event.repository.default_branch || github.ref_name }}'
          }

          $sourcePath = '.'
          $needsExternalCheckout = 'false'

          if ($requestedRepository -ne '${{ github.repository }}') {
            $sourcePath = 'app-source'
            $needsExternalCheckout = 'true'
          }

          "repository=$requestedRepository" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "ref=$requestedRef" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "path=$sourcePath" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "external_checkout=$needsExternalCheckout" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
        shell: powershell

      - name: Checkout TrayApp source
        if: steps.source.outputs.external_checkout == 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.source.outputs.repository }}
          ref: ${{ steps.source.outputs.ref }}
          path: app-source

      - name: Print source checkout settings
        run: |
          Write-Host "APP_REPOSITORY=${{ steps.source.outputs.repository }}"
          Write-Host "APP_REF=${{ steps.source.outputs.ref }}"
          Write-Host "APP_SOURCE_PATH=${{ steps.source.outputs.path }}"
          Write-Host "EXTERNAL_CHECKOUT=${{ steps.source.outputs.external_checkout }}"
        shell: powershell

      - name: Configure TrayApp for ARM64
        run: |
          cmake --version
          cmake -S "${{ steps.source.outputs.path }}" -B app-build `
            -G "Visual Studio 17 2022" `
            -A ARM64 `
            -DCMAKE_BUILD_TYPE=Release
        shell: powershell

      - name: Build TrayApp Release
        run: cmake --build app-build --config Release --verbose
        shell: powershell

      - name: Prepare installer payload
        run: |
          TrayAppInstaller\scripts\Prepare-Payload.ps1 `
            -AppBuildBin app-build\bin `
            -PayloadDir TrayAppInstaller\src\payload
        shell: powershell

      - name: Generate WiX payload
        run: |
          TrayAppInstaller\scripts\Generate-WixPayload.ps1 `
            -PayloadDir TrayAppInstaller\src\payload `
            -OutputPath TrayAppInstaller\src\Payload.generated.wxs
        shell: powershell

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build MSI
        run: |
          dotnet build TrayAppInstaller\src\TrayAppInstaller.wixproj `
            -c Release `
            -p:ProductVersion=${{ env.PRODUCT_VERSION }}
        shell: powershell

      - name: Collect installer artifacts
        run: |
          New-Item -ItemType Directory -Force -Path installer-artifacts | Out-Null
          Get-ChildItem TrayAppInstaller\src\bin\Release -Filter *.msi -Recurse |
            Copy-Item -Destination installer-artifacts\ -Verbose
          Get-ChildItem installer-artifacts | Format-Table Name, Length
        shell: powershell

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: TrayAppInstaller-ARM64
          path: installer-artifacts/
          retention-days: 90
